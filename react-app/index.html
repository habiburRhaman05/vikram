<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Per-page <title>/<meta description>/canonical/og: tags are rendered
         by each page component (React 19 hoists <title>/<meta>/<link>
         rendered anywhere in the tree up into <head> automatically) - see
         src/components/common/PageMeta.jsx.

         THE TITLE BELOW IS A FALLBACK, AND THERE WILL BE TWO OF THEM.
         React's hoisted <title> is inserted ahead of this one, so it is what
         the tab, the history entry and a JS-rendering crawler use on every
         route; this line only decides what is shown before the bundle
         executes and to a crawler that runs no JavaScript at all. It is
         written for the home page because that is the page a crawler with
         no JS is overwhelmingly likely to be asking about.

         DO NOT ADD A STATIC <meta name="description"> HERE. That was tried:
         it produces two description tags on every route, and because this
         one is parsed first, every page's own description was shadowed by
         the generic one. The per-page description comes only from React.
         Crawlers that run no JavaScript therefore get no description - that
         is a real limitation of shipping a client-rendered app, and the fix
         for it is prerendering the routes at build time, not a second tag
         here. -->
    <title>GHLevelUp - CRM, AI Automation &amp; Web Development for Growing Businesses</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=swap: the fallback font paints first and the real face
         swaps in when ready. This previously ran with display=optional,
         which SKIPS the webfont entirely whenever it does not arrive
         within ~100ms (first visit, cold cache, dev) - the page then
         rendered in Segoe UI for that whole session, which read as a
         font mismatch. Re-layout on swap is the right trade here: brand
         typography must always win. -->
    <!-- DM Sans for headings and UI, Space Mono for body copy (Roboto as
         the fallback), Caveat for the hand-drawn accent word in the h1.
         DM Sans ships as a variable font, so the 400-1000 range covers
         every weight the stylesheets ask for (400-800) in one file.
         Space Mono is static and has only 400/700 - the 500/600 weights
         some rules request resolve to the nearest of those. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..1000&family=Space+Mono:wght@400;700&family=Roboto:wght@400;500;700&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- GHL CHAT WIDGET (site-wide, identical on every page - kept as a
         plain script tag here rather than injected by React, since it is
         genuinely global and not tied to any one route/component). -->
    <script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6aa3ebfbf095905710c4d288"></script>
 <script>
(function () {
  function injectGlassCSS(shadowRoot) {
    if (shadowRoot.querySelector('#glass-effect-override')) return; // avoid duplicates
    const style = document.createElement('style');
    style.id = 'glass-effect-override';
    style.textContent = `
      #lc_text-widget--box {
        background: rgba(255, 255, 255, 0.15) !important;
        backdrop-filter: blur(20px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        border-radius: 20px !important;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.25) !important;
        overflow: hidden !important;
      }
      .lc_text-widget--header-wrapper {
        background: rgba(0, 64, 193, 0.55) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-bottom: 1px solid rgba(255,255,255,0.2) !important;
      }
      .lc_text-widget--bubble {
        background: rgba(17, 24, 40, 0.6) !important;
        backdrop-filter: blur(10px) !important;
        -webkit-backdrop-filter: blur(10px) !important;
        border: 1px solid rgba(255,255,255,0.25) !important;
      }
      .lc_text-widget--agency-branding {
        background: rgba(255,255,255,0.1) !important;
        backdrop-filter: blur(8px) !important;
        -webkit-backdrop-filter: blur(8px) !important;
      }
    `;
    shadowRoot.appendChild(style);
  }

  /* The widget renders its launcher avatar as an <img> with no alt,
     which is a real accessibility failure on our page even though the
     markup is theirs. It is decorative (the button already has a label),
     so an empty alt is the correct value - it hides it from screen
     readers instead of announcing a filename. */
  function fixWidgetA11y() {
    var roots = [document];
    var host = document.querySelector('chat-widget');
    // The launcher lives inside the widget's shadow root, which
    // document.querySelectorAll cannot see through - query both.
    if (host && host.shadowRoot) roots.push(host.shadowRoot);
    roots.forEach(function (root) {
      root.querySelectorAll('img:not([alt])').forEach(function (img) {
        img.setAttribute('alt', '');
      });
    });
  }

  function tryInject() {
    fixWidgetA11y();
    const widget = document.querySelector('chat-widget');
    if (widget && widget.shadowRoot) {
      injectGlassCSS(widget.shadowRoot);
      return true;
    }
    return false;
  }

  // Widget loads asynchronously via loader.js, so poll + observe for it
  if (!tryInject()) {
    const observer = new MutationObserver(() => {
      if (tryInject()) observer.disconnect();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  /* The launcher image can be swapped in after the shadow root exists
     (which is when the observer above stops), so re-apply the alt fix a
     few times over the first few seconds rather than only once. */
  [500, 1500, 3000, 6000].forEach(function (ms) { setTimeout(fixWidgetA11y, ms); });
})();
</script>
  </body>
</html>
